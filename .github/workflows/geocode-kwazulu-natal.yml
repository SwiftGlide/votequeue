name: "Geocode — KwaZulu-Natal"

on:
  workflow_dispatch:
    inputs:
      recheck:
        description: "Retry previously-failed rows (no coords found)"
        type: boolean
        default: false

jobs:
  geocode:
    name: "KwaZulu-Natal"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Geocode — KwaZulu-Natal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS="--province \"KwaZulu-Natal\""
          if [ "${{ inputs.recheck }}" = "true" ]; then ARGS="$ARGS --recheck"; fi
          eval python3 geocode.py $ARGS
